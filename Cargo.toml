[workspace]
resolver = "2"
members = [
    "core",
    "platforms/tauri-common",
    "platforms/windows",
    "platforms/macos",
    "platforms/android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mausfer contributors"]
description = "Cross-platform LAN and self-hosted remote P2P file transfer"
keywords = ["p2p", "file-transfer", "lan", "webrtc", "tauri"]
repository = "https://github.com/TirededMaxer/Mausfer"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
socket2 = { version = "0.5", features = ["all"] }
webrtc = { version = "0.13" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rand = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 0

[profile.release]
lto = true
strip = true
