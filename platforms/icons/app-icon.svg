<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#0d1b2e"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ba3ff"/>
      <stop offset="1" stop-color="#86c5ff"/>
    </linearGradient>
  </defs>
  <!-- rounded-square background -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <!-- subtle ring -->
  <circle cx="512" cy="512" r="356" fill="none" stroke="#2c4f78" stroke-width="12"/>
  <!-- two horizontal arrows: send (right) and receive (left) -->
  <g fill="url(#arrow)">
    <!-- upper arrow -> right (send) -->
    <rect x="248" y="376" width="420" height="110" rx="55"/>
    <path d="M 640 396 L 800 431 L 640 466 Z"/>
    <!-- lower arrow <- left (receive) -->
    <rect x="356" y="538" width="420" height="110" rx="55"/>
    <path d="M 384 558 L 224 593 L 384 628 Z"/>
  </g>
  <!-- center dots -->
  <circle cx="480" cy="431" r="18" fill="#9fd4ff"/>
  <circle cx="544" cy="593" r="18" fill="#9fd4ff"/>
</svg>
